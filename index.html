<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DECR 27000 — AuditSys Mini (ISO/IEC 27002:2022)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-lg w-full bg-white rounded-xl shadow-lg border border-slate-200 overflow-hidden">
    <div class="bg-[#003366] text-white p-6">
      <span class="inline-block px-3 py-1 rounded-full text-xs font-semibold bg-[#00C6D0] text-[#003366] mb-2">
        ISO/IEC 27001 &amp; 27002:2022
      </span>
      <h1 class="text-2xl font-bold">DECR 27000 — AuditSys Mini</h1>
      <p class="text-sm text-slate-200 mt-1">
        Sistema de Gestión de Auditorías de Seguridad de la Información
      </p>
    </div>
    <div class="p-6 space-y-4">
      <div class="flex items-center justify-between p-4 rounded-lg bg-slate-100 border border-slate-200">
        <div>
          <p class="text-xs font-semibold uppercase text-slate-500">Estado de Conexión con Backend (Render)</p>
          <p id="api-url" class="text-xs text-slate-600 font-mono mt-0.5">https://decr27000-backend.onrender.com/api/health</p>
        </div>
        <span id="status-badge" class="px-3 py-1 rounded-full text-xs font-semibold bg-amber-100 text-amber-800">
          Verificando...
        </span>
      </div>
      <p id="status-detail" class="text-xs text-slate-500"></p>
    </div>
  </div>

  <script>
    const API_HEALTH = 'https://decr27000-backend.onrender.com/api/health';
    const badge = document.getElementById('status-badge');
    const detail = document.getElementById('status-detail');

    fetch(API_HEALTH)
      .then((r) => r.json())
      .then((data) => {
        if (data && data.ok) {
          badge.textContent = 'Conectado (LIVE)';
          badge.className = 'px-3 py-1 rounded-full text-xs font-semibold bg-[#2E9E5B] text-white';
          detail.textContent = `Respuesta de Render: ${data.service} (${data.status}) — ${data.timestamp}`;
        } else {
          throw new Error('Respuesta inesperada');
        }
      })
      .catch((err) => {
        badge.textContent = 'Sin conexión';
        badge.className = 'px-3 py-1 rounded-full text-xs font-semibold bg-[#D64545] text-white';
        detail.textContent = 'Error al conectar con Render: ' + err.message;
      });
  </script>
</body>
</html>
