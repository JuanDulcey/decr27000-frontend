<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DECR 27000 · AuditSys SGSI — Redirigiendo...</title>
  <link rel="icon" href="logo.jpg" type="image/jpeg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-[#090D16] text-white min-h-screen flex items-center justify-center p-4">
  <div class="login-glass-card rounded-2xl p-7 max-w-sm w-full text-center space-y-4">
    <img src="logo.jpg" alt="DECR 27000" class="h-12 w-auto rounded-lg mx-auto object-contain bg-[#22252A] px-3 py-1.5 border border-white/15" />
    <h1 class="text-lg font-bold text-white">AuditSys SGSI</h1>
    <p class="text-sm text-slate-300">Cargando entorno de auditoría ISO/IEC 27002:2022...</p>
  </div>
  <script type="module">
    import { getAuthToken, getCurrentUser } from './js/auth.js';
    const token = getAuthToken();
    const user = getCurrentUser();
    window.location.replace(token && user ? 'dashboard.html' : 'login.html');
  </script>
</body>
</html>
